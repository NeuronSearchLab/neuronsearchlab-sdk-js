name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: version packages
          title: version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        # No token: npm exchanges this job's OIDC identity for a short-lived
        # credential, which is what id-token: write above is for. This is how
        # @neuronsearchlab/mcp already publishes. The package has to name this
        # repository and this workflow as a trusted publisher on npmjs.com, or
        # the exchange fails and the PUT answers 404 - which reads as "package
        # does not exist" and sends you looking for a permissions problem that
        # is not there.
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"

          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $PACKAGE_VERSION for $PACKAGE_NAME is already published; skipping."
            exit 0
          fi

          npm run build
          npm publish
